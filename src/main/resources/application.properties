# ================================
# Server Configuration
# ================================
server.port=8005

# ================================
# Database Configuration (SQL Server - SSMS)
# ================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=jwt_springboot3;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ================================
# JPA / Hibernate Configuration
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ================================
# JWT Configuration
# ================================
# 256-bit Hex Secret Key (64 hex characters = 256 bits)
security.jwt.secret-key=7134743777217A25432A462D4A614E645267556B58703272357538782F413F44
security.jwt.expiration-time=3600000

# ================================
# Logging
# ================================
logging.level.org.springframework.security=DEBUG
logging.level.vn.iotstar=DEBUG

# ================================
# Thymeleaf
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/
