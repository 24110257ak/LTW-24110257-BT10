# ================================
# Server Configuration
# ================================
server.port=8005

# ================================
# Database Configuration (MySQL)
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/jwt_springboot3?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / Hibernate Configuration
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ================================
# JWT Configuration
# ================================
# 256-bit Hex Secret Key (64 hex characters = 256 bits)
security.jwt.secret-key=7134743777217A25432A462D4A614E645267556B58703272357538782F413F44
security.jwt.expiration-time=3600000

# ================================
# Logging
# ================================
logging.level.org.springframework.security=DEBUG
logging.level.vn.iotstar=DEBUG

# ================================
# Thymeleaf
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/
